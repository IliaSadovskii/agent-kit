name: validate

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      # Manifest and version agreement, skill and agent frontmatter, dangling plugin-root
      # references, the engine size cap, and shell syntax across the payload.
      - name: Validate the plugin
        run: bash scripts/validate.sh

      - name: Check that the tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          version="$(cat VERSION)"
          if [ "$tag" != "$version" ]; then
            echo "tag v$tag does not match VERSION $version" >&2
            exit 1
          fi
