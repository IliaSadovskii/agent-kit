# S9 — a provider that starts, answers, keeps the contract and cannot edit a file.
#
# `probe` has gone and found out whether it can create a file since S2, and until
# S9 nothing read the answer. That made `can_write` the one field in this kit
# written for nobody, and it made the ladder call a sandboxed tool level A.
#
# S9 is what makes it reachable rather than theoretical: `codex exec` runs
# read-only unless its declaration says otherwise, so a declaration that forgets
# the sandbox flag ships a provider that passes every rung the ladder had and
# cannot do the one thing every step above `probe` exists to do.

[case]
title = "a session that cannot create a file where it landed"
fires = "the ladder stops on `writes` and the provider earns no level at all"

[expect]
exit_code = 0
status = "done"
