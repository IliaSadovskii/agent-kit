[project]
name = "agent-kit"
version = "3.0.0.dev0"
description = "Drives other people's CLI agents through a method that is a program, not prose."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
agent-kit = "agent_kit.cli.main:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_kit"]

# The method is prose the driver encloses, so it travels with the package.
[tool.hatch.build.targets.wheel.force-include]
"method" = "agent_kit/method"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
