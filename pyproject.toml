[project]
name = "agent-kit"
dynamic = ["version"]
description = "Drives other people's CLI agents through a method that is a program, not prose."
requires-python = ">=3.12"
dependencies = []

[project.scripts]
agent-kit = "agent_kit.cli.main:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-timeout>=2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# One home for the version: the module. Everything else reads it.
[tool.hatch.version]
path = "src/agent_kit/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_kit"]

# The method is prose the driver encloses, so it travels with the package.
[tool.hatch.build.targets.wheel.force-include]
"method" = "agent_kit/method"

[tool.pytest.ini_options]
testpaths = ["tests"]
# A regression in a timeout is a hang, not a red test, unless the suite has one
# of its own. This is longer than any honest test and shorter than a night.
addopts = "-q --timeout=300"
