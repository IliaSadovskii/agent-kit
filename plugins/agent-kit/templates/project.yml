# The project's own corner of the kit. Written by blueprint, read by every command.
# Never edited by a build command — they write only into the run file and the machine lines of
# the knowledge entries.

language: en                      # the language the kit talks to the owner in, and writes prose in

stage: development                # development | released — where this product actually runs.
                                  # `development` means it runs on the owner's machine and nowhere
                                  # else: there is no production environment, no store listing, no
                                  # users. Then anything a run finds that only matters at release —
                                  # a push credential, a key in a live environment, a store's
                                  # requirement — is NOT a manual action for the owner. It is a line
                                  # in docs/deployment.md, and the pull request does not carry it.
                                  # Measured on one run: a third of a nineteen-item list of things
                                  # for the owner to do was about a release that did not exist, and
                                  # it was what made the six that mattered unfindable.
                                  # Empty is not an answer — a project with nothing here is asked
                                  # once, at the next gate, and never guessed at.

commands:                         # the project's real commands; the only place they are recorded
  test:
  lint:
  types:                          # leave empty where the project has no type checker
  run:                            # what starts the application, for the run that has to click it
  e2e:                            # what walks the product end to end — the scenarios of
                                  # docs/knowledge/scenarios.md, against a running application.
                                  # It is a different command from `test` because it is a different
                                  # thing: `test` proves one feature and every feature runs it,
                                  # while this proves the product and only what integrates a batch
                                  # runs it. A feature never does — measured on one run, `ship`
                                  # started this 144 times across 80 sessions against its own
                                  # instruction, and the guard hook now refuses it there.
                                  # Empty is a real answer and is said at the gate, where the owner
                                  # is standing and the price of a run is being named: without it
                                  # the finish line is somebody's hands on a phone rather than a
                                  # green suite, and that is a fact about the run, not a defect.
  visual:                         # what compares a screen against how it looked before. The one
                                  # class of defect a suite cannot reach: a run with no such command
                                  # ships a screen nobody has looked at, and the first eyes on it
                                  # are the owner's, batches later. Often not a new tool — a browser
                                  # runner already here usually does it with a flag and a folder of
                                  # baselines. Every feature that changes a screen runs it.
                                  #   visual: npx playwright test --grep @visual
  contract:                       # what holds the outside services this product calls — or the API
                                  # it publishes — to the shape the code expects. Every other test
                                  # goes through a stand-in and stays green through a change nobody
                                  # made. It calls the real thing, so it costs a key and money per
                                  # run: a batch's closing session and an epic's proving phase run
                                  # it, never a feature.
                                  #
                                  # Empty is NOT a silent answer for these two, the way it is for
                                  # `e2e`: write the refusal in `tests` below, with a date.
  mutate:                         # what proves the tests can fail: it changes the product's own
                                  # logic in small valid ways and reports how many of those changes
                                  # the suite noticed. A test written after the code and never seen
                                  # red is free to assert nothing, and no reading of the diff tells
                                  # you which one that is — the surviving mutant does.
                                  # Off-the-shelf per ecosystem: mutmut or cosmic-ray (Python),
                                  # Stryker (JS, TS, C#), PIT (Java), infection (PHP), go-mutesting.
                                  # Write `{files}` where the tool takes the files to mutate: the
                                  # run replaces it with what this feature changed against its own
                                  # base, space-separated, which is the only list it can compute
                                  # and the manifest cannot. Without it the tool runs over the
                                  # whole project, re-running the suite once per mutation, and the
                                  # step takes hours and is skipped. It must print how many
                                  # mutants were killed and how many survived.
                                  #   mutate: vendor/bin/infection --filter={files}
                                  # Empty is a real answer: the step then says it did not run,
                                  # which is not the same as passing.

tests:
  unmet:                          # a test proving a promise the product does not keep carries the
                                  # comment `agent-kit:unmet <entry key>` — that is the kit's own
                                  # constant and never changes. This key is the other half: what
                                  # keeps such a test off the red in THIS project's runner, so
                                  # every run marks them the same way. Prefer a form that runs the
                                  # test and expects the failure — pytest xfail(strict=True), Jest
                                  # test.failing — over one that skips it, like Pest todo: a skipped
                                  # test proves nothing and stays quiet the day the product keeps
                                  # the promise. Several suites? Nest one line per suite:
                                  #   unmet:
                                  #     php: "->todo()"
                                  #     js: test.failing

  visual:                         # ONLY a refusal: `no <date> <reason>`, and only where
  contract:                       # `commands.visual` / `commands.contract` above is empty. A claim
                                  # that this project can see something goes in the command, where
                                  # the check starts it and every run can use it — `yes` was a word,
                                  # and a word proved nothing.
                                  #
                                  # `no` is a real answer and often the right one: an API with no
                                  # interface has nothing to look at. The date is the point — a
                                  # refusal written when the product had no front end is not a
                                  # decision about the product that grew one, and after six months
                                  # the check asks again.
                                  #   visual: no 2026-08-19 — API only, no interface in this repo
                                  # Only /agent-kit:blueprint writes these, with the owner there.

knowledge:                        # one verdict per slot: filled | not_applicable | open_question
  product: open_question          # not_applicable and open_question carry a reason after the value
  actors: open_question
  entities: open_question
  actions: open_question
  screens: open_question
  integrations: open_question
  scenarios: open_question
  stack: open_question

checks:
  stack_researched:               # date the stack slot was last derived; --check names it past six months
  sight_reviewed:                 # date the two verdicts above were last taken with the owner;
                                  # --check names it past six months, because a project grows
                                  # surfaces and a verdict does not notice
  deps:                           # direct dependency manifests, and their hash at that moment
