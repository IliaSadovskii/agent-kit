# The project's own corner of the kit. Written by blueprint, read by every command.
# Never edited by a build command — they write only into the run file and the machine lines of
# the knowledge entries.

language: en                      # the language the kit talks to the owner in, and writes prose in

commands:                         # the project's real commands; the only place they are recorded
  test:
  lint:
  types:                          # leave empty where the project has no type checker
  run:                            # what starts the application, for the run that has to click it
  mutate:                         # what proves the tests can fail: it changes the product's own
                                  # logic in small valid ways and reports how many of those changes
                                  # the suite noticed. A test written after the code and never seen
                                  # red is free to assert nothing, and no reading of the diff tells
                                  # you which one that is — the surviving mutant does.
                                  # Off-the-shelf per ecosystem: mutmut or cosmic-ray (Python),
                                  # Stryker (JS, TS, C#), PIT (Java), infection (PHP), go-mutesting.
                                  # Write `{files}` where the tool takes the files to mutate: the
                                  # run replaces it with what this feature changed against its own
                                  # base, space-separated, which is the only list it can compute
                                  # and the manifest cannot. Without it the tool runs over the
                                  # whole project, re-running the suite once per mutation, and the
                                  # step takes hours and is skipped. It must print how many
                                  # mutants were killed and how many survived.
                                  #   mutate: vendor/bin/infection --filter={files}
                                  # Empty is a real answer: the step then says it did not run,
                                  # which is not the same as passing.

tests:
  unmet:                          # a test proving a promise the product does not keep carries the
                                  # comment `agent-kit:unmet <entry key>` — that is the kit's own
                                  # constant and never changes. This key is the other half: what
                                  # keeps such a test off the red in THIS project's runner, so
                                  # every run marks them the same way. Prefer a form that runs the
                                  # test and expects the failure — pytest xfail(strict=True), Jest
                                  # test.failing — over one that skips it, like Pest todo: a skipped
                                  # test proves nothing and stays quiet the day the product keeps
                                  # the promise. Several suites? Nest one line per suite:
                                  #   unmet:
                                  #     php: "->todo()"
                                  #     js: test.failing

knowledge:                        # one verdict per slot: filled | not_applicable | open_question
  product: open_question          # not_applicable and open_question carry a reason after the value
  actors: open_question
  entities: open_question
  actions: open_question
  screens: open_question
  integrations: open_question
  scenarios: open_question
  stack: open_question

checks:
  stack_researched:               # date the stack slot was last derived; --check names it past six months
  deps:                           # direct dependency manifests, and their hash at that moment
