# The shape of a project's pipeline, for the one run that builds it.
#
# Copied and filled by a `ship` with a `task` — "build the CI that runs this project's declared
# commands" — and never generated by a command of this kit. The reason is the same one that keeps
# every stack out of this payload: the steps are the project's own declared commands, and a template
# that guessed at them would be a stack matrix rotting in a plugin. Fill it from
# `.agent-kit/project.yml` → `commands`, and from nothing else.
#
# Who reads it: GitHub, on every push. Who may change it: any run that changes what the project
# declares — `check.py --tests` says when it has gone stale, because a declared command no workflow
# names is one of its four answers. Who may remove it: the owner, on the day the project stops
# using GitHub. Without it, every proof a project has was made by the session that wrote the code,
# on the machine that wrote it.
#
# Two things this file is deliberately not:
#
#   - **not a deployment.** A server, a domain, a production environment stay the owner's. A
#     pipeline that deploys needs a rollback, and nothing in this kit can promise one.
#   - **not a second suite.** Every step here is a command the project already declares and a
#     session already runs. What is new is *who* runs it: a machine, after the session is gone, on
#     every push, including the ones no agent made.
#
# Delete every comment and every line that does not apply before committing. A workflow carrying
# instructions to whoever wrote it is a workflow nobody trusts.

name: checks

on:
  push:
    branches: ["main", "claude/**", "sprint/**", "epic/**"]
  # Documentation-only commits are most of what this kit writes — knowledge, the changelog, the debt
  # ledger. Paying for a pipeline over one of those is the cheapest waste there is.
  paths-ignore: ["**/*.md", "<this project's documentation directory>/**"]

# A night pushes the same branch several times. Without this, every superseded run is still paid for.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The fast half, on every branch: what a feature's own session already ran, run again where the
  # tree is not the one that wrote it.
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 20            # a hung job otherwise spends hours of the month's quota
    steps:
      - uses: actions/checkout@v4
      # A cold boot, and it is the point of the job rather than a detail: only files that are in the
      # repository, and one command. Anything else that has to happen first belongs in the
      # container's entrypoint or in `docs/manual.md` — see `epic/references/finish.md`, which
      # settles that split for the fresh checkout an epic makes.
      - run: cp .env.example .env
      - run: <commands.run — the one command that brings this project up>
      - run: <commands.test>
      - run: <commands.lint>
      - run: <commands.types>

  # The slow half, only where a batch is delivered. Walking the whole product on every feature
  # branch is what the minutes go on: measured on one project, a build workflow ran 35 minutes.
  product:
    if: startsWith(github.ref, 'refs/heads/sprint/') || startsWith(github.ref, 'refs/heads/epic/') || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: <commands.run>
      - run: <commands.e2e>
      # `commands.mutate` goes here too, where the project declares one — over the branch's own
      # diff, not the whole product.
