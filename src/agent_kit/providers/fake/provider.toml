[provider]
title = "the provider that is not real"
level = "A"
real  = false
notes = """
A fixture, not an agent. It answers from files given as options — `reply=<path>`,
repeated once per attempt — so the kit's own tests and the bench run with no CLI
installed and no network. Everything up to the first adapter must be testable
that way; that is why the second version's tests ran at all.
"""
