[provider]
# The one shipped provider that is the kit's own, so its words are the kit's
# words and a person reads them on `doctor`.
title = "провайдер, который не настоящий"
level = "A"
real  = false
notes = """
Фикстура, а не агент. Отвечает из файлов, переданных опциями — `reply=<путь>`,
по одному на попытку, — поэтому собственные тесты кита и стенд идут без единого
установленного CLI и без сети. Всё до первого адаптера обязано проверяться
именно так; на этом и держались тесты второй версии.
"""
