# What is true about Claude Code. Not what this machine chose — that lives in
# ~/.config/agent-kit/config.toml, and neither file may hold the other's kind.

[provider]
title  = "Claude Code"
level  = "B"
real   = true
binary = "claude"
notes  = """
Driven headless: one composed input on stdin, one JSON answer on stdout. The
session is named by the kit with --session-id and the name is confirmed from the
answer, so nothing is guessed. It reads the project's own instruction file and
nothing else from the machine it runs on. The subscription is the CLI's own login; the kit
never sees a key and never talks to a model API.
"""

[provider.setup]
# What a person runs. The kit prints these and runs neither: installing is the
# owner's act on the owner's machine, and a login opens a browser. What the
# install did is measured afterwards by looking for `binary` again.
install = ["npm", "install", "-g", "@anthropic-ai/claude-code"]
login   = ["claude", "/login"]
# One line at the person standing mid-install, and it is about this tool:
# `/login` is typed inside Claude Code's own screen, not at the shell.
login_note = "Это команда внутри самого claude: он откроет браузер, выберите аккаунт и закройте его экран."

[provider.flags]
# The shape: a flag that carries a value is [flag], and the value follows it.
headless    = ["-p", "--output-format", "json"]
full_access = ["--permission-mode", "bypassPermissions"]
# The project's own CLAUDE.md is knowledge a step wants; the operator's personal
# one is instructions the driver did not compose. Measured: with no flag a
# session obeys both, with this one only the project's.
instructions = ["--setting-sources", "project"]
model       = ["--model"]
effort      = ["--effort"]
session     = ["--session-id"]
version     = ["--version"]

[provider.answer]
# Where each fact lives in the JSON the CLI prints.
text     = "result"
session  = "session_id"
cost     = "total_cost_usd"
failed   = "is_error"
window   = "modelUsage"
used     = "usage"

[provider.transcript]
# A session's record: <root>/<the project path, slashes and dots turned to dashes>/<session>.jsonl
root = "~/.claude/projects"

[provider.limits]
# How a limited account announces itself in the text it returns.
says  = ["usage limit reached", "rate limit", "limit will reset"]
until = "(?:reset(?:s|ting)?(?: at)?|until)\\s+([^.\\n]+)"
