# The verification slot is proven by running it, not by reading it. One command passes, the next
# exits 3, and only running them can tell the difference. Structural, exit 2.
#
# Every command here is trivial on purpose. A fixture must never name this repository's real
# verification command: it runs these tests, and the build would recurse.

version: 1

slots:
  north_star:
    status: open_question

  architecture_stance:
    status: open_question

  verification:
    status: filled
    commands:
      ok: "true"
      broken: "echo boom >&2; exit 3"
    criterion: every command runs from the project root and exits 0

  mvp_bounds:
    status: open_question

  scenarios:
    status: not_applicable
    reason: a fixture has no product data to walk a scenario over

  deferred_seams:
    status: not_applicable
    reason: nothing is postponed in a fixture

collections:
  actors:
    status: not_applicable
    reason: one actor, the test that runs this

  entities:
    status: not_applicable
    reason: no domain model here

  actions:
    status: not_applicable
    reason: no actions here

  screens:
    status: not_applicable
    reason: no interface

  integrations:
    status: not_applicable
    reason: nothing outside this tree
