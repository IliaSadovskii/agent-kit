# Project manifest — state and sources of truth for the autonomous flow.
#
# The kit developing itself. This file is what makes every pipeline in this repository speak the
# owner's language instead of defaulting to English; without it, `language` is unset and every
# session — including the headless ones a sprint launches — falls back.

kit_version: 0.8.0

# The kit core stays English: code, identifiers, paths, and commit messages. This is the language
# the agent talks to the owner in, and the language a pull request description is written in.
language: ru

# There is no product idea or roadmap document here — the kit's own roadmap lives in the owner's
# head and in CHANGELOG.md. Task selection and product scoping therefore stay off; a feature the
# owner names is built as normal, which is how every feature in this repository has been built.
bootstrapped: false
bootstrapped_at: null

sources:
  idea: null
  roadmap: null
  architecture: null
  # This repository's standards are its development guide, not a generated playbook: it has no
  # dependency manifest to fingerprint, so `stack-playbook` has nothing to refresh here.
  coding_standards: docs/developing.md
  ci: .github/workflows/ci.yml
  # This repository has no screens of its own to map.
  screens: null
